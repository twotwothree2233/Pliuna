      - name: Windows 11 desktop startup and restart
        if: "!inputs.windows11_default_startup_only && (!inputs.windows11_checkout_probe_only && !inputs.windows11_symlink_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.desktop.outcome == 'success'))"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test platform-smoke.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/source-desktop"
      - name: Build local directory package
        id: directory_package
        if: "!inputs.windows11_checkout_probe_only && !inputs.windows11_symlink_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success' && (steps.electron_native.outcome == 'success' || steps.default_electron.outcome == 'success') && (inputs.windows11_default_startup_only || steps.packaging_checks.outcome == 'success'))"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/package-desktop.mjs --output "%TRELLIS_DESKTOP_OUTPUT%" --format ${{ inputs.windows11_candidate_acceptance && 'default' || 'dir' }}
      - name: Probe packaged native modules, process trees and offline PDF
        if: "!inputs.windows11_default_startup_only && (!inputs.windows11_checkout_probe_only && !inputs.windows11_symlink_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.directory_package.outcome == 'success'))"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/check-desktop-runtime.mjs "%TRELLIS_DESKTOP_OUTPUT%"
      - name: Windows 11 packaged desktop startup and restart
        if: "!inputs.windows11_default_startup_only && (!inputs.windows11_checkout_probe_only && !inputs.windows11_symlink_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.directory_package.outcome == 'success' && steps.desktop.outcome == 'success'))"
        env:
          TRELLIS_PACKAGED_OUTPUT: ${{ env.TRELLIS_DESKTOP_OUTPUT }}
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test platform-smoke.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/packaged-desktop"
      - name: Build test-only handle-preservation helper
        id: preservation_helper
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.directory_package.outcome == 'success' && steps.desktop.outcome == 'success'"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/build-windows-preserve.mjs
      - name: Preserve prior default data and install the current-user NSIS candidate
        id: candidate_install
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.preservation_helper.outcome == 'success'"
        timeout-minutes: 5
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/windows11-candidate.cjs install
      - name: Verify installed ACL, Job, RPC, descendant cleanup and PDF
        id: installed_runtime
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.candidate_install.outcome == 'success'"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/check-desktop-runtime.mjs --installed
      - name: Windows 11 fresh default startup and restart
        id: default_desktop
        if: "!cancelled() && inputs.windows11_default_startup_only && steps.default_data.outcome == 'success' && steps.directory_package.outcome == 'success' && steps.desktop.outcome == 'success' && (!inputs.windows11_candidate_acceptance || steps.installed_runtime.outcome == 'success')"
        env:
          TRELLIS_WINDOWS11_DEFAULT_STARTUP: '1'
          TRELLIS_PACKAGED_OUTPUT: ${{ env.TRELLIS_DESKTOP_OUTPUT }}
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test default-startup.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/default-desktop"
      - name: Require the actual default-startup result and all exit confirmations
        id: default_result
        if: "!cancelled() && inputs.windows11_default_startup_only && steps.default_desktop.outcome != 'skipped'"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/verify-default-startup-result.cjs
      - name: Installed candidate synthetic materials, plugin, export and recovery
        id: candidate_business
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.default_result.outcome == 'success'"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test candidate-business.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/candidate-business"
      - name: Uninstall, retain default data and reinstall the same candidate
        id: candidate_reinstall
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.candidate_business.outcome == 'success'"
        timeout-minutes: 7
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/windows11-candidate.cjs reinstall
      - name: Verify reinstalled task, plugin, recovery and real process exits
        id: candidate_restored
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.candidate_reinstall.outcome == 'success'"
        env:
          TRELLIS_CANDIDATE_REINSTALLED: '1'
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test candidate-business.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/candidate-reinstalled"
      - name: Require all actual local-candidate results
        if: "!cancelled() && inputs.windows11_candidate_acceptance"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/verify-windows11-candidate.cjs
      - name: Remove only this candidate installation after a failed application scenario
        if: "!cancelled() && inputs.windows11_candidate_acceptance && steps.candidate_install.outcome == 'success' && steps.candidate_business.outcome != 'success'"
        timeout-minutes: 4
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/windows11-candidate.cjs uninstall-after-failure
      - name: Keep the checkout diagnostic stage
        if: "always() && (inputs.windows11_checkout_probe_only || inputs.windows11_symlink_probe_only) && steps.host.outcome == 'success'"
        uses: actions/github-script@v7
        env:
          CHECKOUT_OUTCOME: ${{ steps.source_checkout.outcome }}
          NETWORK_OUTCOME: ${{ steps.public_tls.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const file = path.join(process.env.TRELLIS_WIN11_EVIDENCE, 'checkout-preparation.json');
            const report = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : { stage: 'precheck_unavailable', candidates: [] };
            const outcomes = new Set(['success', 'failure', 'cancelled', 'skipped']);
            report.checkout = outcomes.has(process.env.CHECKOUT_OUTCOME) ? process.env.CHECKOUT_OUTCOME : 'unknown';
            report.application_tests = 0;
            if (['success', 'failure'].includes(process.env.NETWORK_OUTCOME)) report.stage = 'network_diagnostics_' + process.env.NETWORK_OUTCOME;
            else if (report.checkout !== 'success' && report.stage === 'source_ready') report.stage = 'checkout_' + report.checkout;
            fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify({ stage: report.stage, checkout: report.checkout, application_tests: 0 }));
      - name: Keep Windows 11 environment and desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trellis-win11-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
