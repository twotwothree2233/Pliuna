name: Cross-platform baseline
run-name: ${{ inputs.windows11_checkout_probe_only && 'Windows 11 checkout diagnostics' || inputs.windows11_standard_user && 'Windows 11 standard user acceptance' || inputs.windows11_acl_probe_only && 'Windows 11 ACL technical acceptance' || inputs.windows11_startup_probe_only && 'Windows 11 startup diagnostics' || inputs.windows11_process_package_only && 'Windows 11 process and package verification' || (inputs.windows11_only || inputs.install_windows11_tools) && 'Windows 11 native acceptance' || 'Cross-platform baseline' }}

on:
  push:
    branches: [main, ao/trellis-12/cross-platform-ci]
  pull_request:
  workflow_dispatch:
    inputs:
      windows11_acl_probe_only:
        description: Only verify native ACL identity, permission semantics and Job containment before product activation
        type: boolean
        default: false
      windows11_only:
        description: Only test Windows 11 on DESKTOP-SFE95TP
        type: boolean
        default: false
      windows11_standard_user:
        description: Require a genuine standard-user interactive token; use with windows11_only and all other modes off
        type: boolean
        default: false
      windows11_checkout_probe_only:
        description: Only diagnose bounded Git discovery and a new isolated checkout; requires windows11_only and windows11_standard_user
        type: boolean
        default: false
      windows11_prepare_git:
        description: Prepare current-standard-user Git only, then diagnose isolated checkout; requires windows11_only, windows11_standard_user and windows11_checkout_probe_only
        type: boolean
        default: false
      install_windows11_tools:
        description: Install approved missing Git, Python 3.12 and VS2022 C++ tools on DESKTOP-SFE95TP
        type: boolean
        default: false
      windows11_process_package_only:
        description: Only verify process, Electron, GUI and directory-package entries on the designated Windows 11 host
        type: boolean
        default: false
      windows11_startup_probe_only:
        description: Only diagnose isolated RuntimeStore startup on the designated Windows 11 host
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baseline:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows11_only || inputs.windows11_standard_user || inputs.windows11_checkout_probe_only || inputs.windows11_prepare_git || inputs.install_windows11_tools || inputs.windows11_startup_probe_only || inputs.windows11_process_package_only || inputs.windows11_acl_probe_only)) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Native Windows file and process suites took the full 30-minute job budget.
    # Keep finite tests and the final failure gate; allow the remaining probes to run.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS ARM64, os: macos-15, arch: arm64 }
          - { name: macOS Intel, os: macos-15-intel, arch: x64 }
          - { name: Windows x64, os: windows-2022, arch: x64 }
          - { name: Linux glibc x64, os: ubuntu-24.04, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH)throw Error('Unexpected runner architecture');console.log(process.platform,process.arch,process.version)"
      - name: Install pinned dependencies
        # Cached build side effects can turn framework symlinks into copies.
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Check Electron framework links
        id: electron_distribution
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { lstatSync, readlinkSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const framework = join(dirname(require.resolve('electron/package.json')), 'dist/Electron.app/Contents/Frameworks/Electron Framework.framework');
          for (const [name, target] of [['Versions/Current', 'A'], ['Electron Framework', 'Versions/Current/Electron Framework'], ['Resources', 'Versions/Current/Resources']]) {
            const file = join(framework, name);
            if (!lstatSync(file).isSymbolicLink() || readlinkSync(file) !== target) throw Error('ELECTRON_FRAMEWORK_LINKS_INVALID: ' + name);
          }
          console.log('Electron framework links preserved');
          JS
      - name: Windows Job Object minimal acceptance
        if: runner.os == 'Windows'
        run: pnpm verify:windows-job
      - name: Install contract validation dependency
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Build and check generated types
        id: build
        run: pnpm build
      - name: Check generated contract drift
        run: git diff --exit-code -- src/shared/contracts.generated.ts
      - name: Validate contracts
        run: pnpm verify:contracts
      - name: Portable tests (Node ABI)
        id: portable
        run: pnpm test:portable
      - name: Windows core process lifecycle (Node ABI)
        if: runner.os == 'Windows'
        run: pnpm exec vitest run --config vitest.process.config.ts tests/unit/platform-process-tree.test.ts tests/unit/monty-lifecycle.test.ts
      # Independent checks keep running after a filesystem failure. No failure
      # is ignored: any unsuccessful step still fails the matrix job.
      - name: Filesystem behavior (synthetic integrity, Node ABI)
        if: "!cancelled() && steps.build.outcome == 'success' && steps.portable.outcome == 'success'"
        run: pnpm exec vitest run --config vitest.files.config.ts
      - name: Process trees and lifecycle (synthetic integrity, Node ABI)
        if: "!cancelled() && steps.build.outcome == 'success' && steps.portable.outcome == 'success'"
        run: pnpm exec vitest run --config vitest.process.config.ts
      - name: Production payload and desktop platform checks
        id: packaging_checks
        if: "!cancelled() && steps.build.outcome == 'success' && steps.portable.outcome == 'success'"
        run: pnpm test:packaging
      - name: Probe installed Node bindings
        id: node_native
        if: "!cancelled() && steps.build.outcome == 'success' && steps.portable.outcome == 'success'"
        run: node scripts/check-native.mjs
      - name: Probe installed Electron bindings (switch ABI)
        id: electron_native
        if: "!cancelled() && steps.node_native.outcome == 'success'"
        run: pnpm verify:native:electron
      - name: Process control with Electron runtime
        if: "!cancelled() && steps.electron_native.outcome == 'success'"
        run: node scripts/check-electron-process.mjs
      - name: Prepare Linux desktop
        id: linux_desktop
        if: "!cancelled() && runner.os == 'Linux' && steps.electron_native.outcome == 'success'"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
          # Ephemeral CI host: allow Chromium's user namespace sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop startup and restart (Linux)
        if: "!cancelled() && runner.os == 'Linux' && steps.linux_desktop.outcome == 'success'"
        run: xvfb-run -a pnpm exec playwright test platform-smoke.spec.ts
      - name: Desktop startup and restart (macOS / Windows)
        if: "!cancelled() && runner.os != 'Linux' && steps.electron_native.outcome == 'success'"
        run: pnpm exec playwright test platform-smoke.spec.ts
      - name: Build local directory package
        id: directory_package
        if: "!cancelled() && steps.build.outcome == 'success' && steps.electron_native.outcome == 'success' && steps.packaging_checks.outcome == 'success' && (runner.os != 'macOS' || steps.electron_distribution.outcome == 'success')"
        shell: bash
        run: node scripts/package-desktop.mjs --output "$RUNNER_TEMP/trellis-package" --format dir
      - name: Probe packaged native modules, process trees and offline PDF
        if: "!cancelled() && steps.directory_package.outcome == 'success'"
        shell: bash
        run: node scripts/check-desktop-runtime.mjs "$RUNNER_TEMP/trellis-package"
      - name: Packaged desktop startup and restart (Linux)
        if: "!cancelled() && runner.os == 'Linux' && steps.directory_package.outcome == 'success' && steps.linux_desktop.outcome == 'success'"
        env:
          TRELLIS_PACKAGED_OUTPUT: ${{ runner.temp }}/trellis-package
        run: xvfb-run -a pnpm exec playwright test platform-smoke.spec.ts
      - name: Packaged desktop startup and restart (macOS / Windows)
        if: "!cancelled() && runner.os != 'Linux' && steps.directory_package.outcome == 'success' && steps.electron_native.outcome == 'success'"
        env:
          TRELLIS_PACKAGED_OUTPUT: ${{ runner.temp }}/trellis-package
        run: pnpm exec playwright test platform-smoke.spec.ts
      - name: Keep desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  windows11:
    name: ${{ inputs.windows11_checkout_probe_only && 'Windows 11 checkout diagnostics / DESKTOP-SFE95TP' || inputs.windows11_standard_user && 'Windows 11 standard user / DESKTOP-SFE95TP' || inputs.windows11_acl_probe_only && 'Windows 11 ACL technical acceptance / DESKTOP-SFE95TP' || inputs.windows11_startup_probe_only && 'Windows 11 startup diagnostics / DESKTOP-SFE95TP' || inputs.windows11_process_package_only && 'Windows 11 process and package verification / DESKTOP-SFE95TP' || 'Windows 11 x64 / DESKTOP-SFE95TP' }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.windows11_only || inputs.windows11_standard_user || inputs.windows11_checkout_probe_only || inputs.windows11_prepare_git || inputs.install_windows11_tools || inputs.windows11_startup_probe_only || inputs.windows11_process_package_only || inputs.windows11_acl_probe_only) }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    env:
      PYTHONUTF8: '1'
      TRELLIS_WINDOWS11_ACL_DIAGNOSTICS: '1'
    steps:
      - name: Require the designated Windows 11 x64 host
        id: host
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const suffix = process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT;
            const evidence = path.join(process.env.RUNNER_TEMP, 'trellis-win11-' + suffix);
            fs.mkdirSync(evidence, { recursive: true });
            core.exportVariable('TRELLIS_WIN11_EVIDENCE', evidence);
            core.exportVariable('TRELLIS_DESKTOP_OUTPUT', path.join(process.env.RUNNER_TEMP, 'trellis-win11-package-' + suffix));
            const standardUser = context.payload.inputs?.windows11_standard_user === 'true';
            if (context.payload.inputs?.windows11_prepare_git === 'true' &&
                (!standardUser || context.payload.inputs?.windows11_only !== 'true' || context.payload.inputs?.windows11_checkout_probe_only !== 'true')) {
              throw Error('GIT_PREPARATION_REQUIRES_STANDARD_CHECKOUT_DIAGNOSTICS');
            }
            if (context.payload.inputs?.windows11_checkout_probe_only === 'true' && !standardUser) {
              throw Error('CHECKOUT_DIAGNOSTICS_REQUIRE_STANDARD_USER_MODE');
            }
            if (standardUser && (context.payload.inputs?.windows11_only !== 'true' ||
                ['install_windows11_tools', 'windows11_startup_probe_only', 'windows11_process_package_only', 'windows11_acl_probe_only'].some(key => context.payload.inputs?.[key] === 'true'))) {
              throw Error('WINDOWS11_STANDARD_USER_REQUIRES_FULL_MODE_WITHOUT_INSTALLATION');
            }
            if (['windows11_startup_probe_only', 'windows11_process_package_only', 'windows11_acl_probe_only'].filter(key => context.payload.inputs?.[key] === 'true').length > 1) throw Error('WINDOWS11_MODES_ARE_EXCLUSIVE');
            if (process.env.RUNNER_NAME !== 'DESKTOP-SFE95TP') throw Error('UNEXPECTED_RUNNER');
            if (process.platform !== 'win32' || process.arch !== 'x64') throw Error('WINDOWS_X64_REQUIRED');
            // Read-only inline queries do not load a .ps1 file or change
            // the machine execution policy.
            const command = `
              $ErrorActionPreference = 'Stop';
              [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false;
              $os = Get-CimInstance Win32_OperatingSystem;
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent();
              $principal = New-Object Security.Principal.WindowsPrincipal($identity);
              $trellisAdminGroupPresent = $null;
              if (${standardUser ? '$true' : '$false'}) {
                # whoami includes deny-only groups. IsInRole alone would also
                # accept a filtered token belonging to an administrator.
                $trellisGroupLines = & (Join-Path $env:SystemRoot 'System32\\whoami.exe') /groups /fo csv /nh;
                if ($LASTEXITCODE -ne 0) { throw 'TOKEN_GROUP_QUERY_FAILED' };
                $trellisGroups = @($trellisGroupLines | ConvertFrom-Csv -Header 'name','type','sid','attributes');
                if ($trellisGroups.Count -eq 0 -or @($trellisGroups | Where-Object { $_.sid -notmatch '^S-[0-9]+(-[0-9]+)+$' }).Count -ne 0) { throw 'TOKEN_GROUP_QUERY_INVALID' };
                $trellisAdminGroupPresent = @($trellisGroups | Where-Object { $_.sid -eq 'S-1-5-32-544' }).Count -ne 0;
              };
              [ordered]@{
                caption = $os.Caption; version = $os.Version;
                build = [int]$os.BuildNumber; product_type = [int]$os.ProductType;
                architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString();
                powershell = $PSVersionTable.PSVersion.ToString();
                user_interactive = [Environment]::UserInteractive;
                session_id = (Get-Process -Id $PID).SessionId;
                elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);
                administrators_group_present = $trellisAdminGroupPresent;
                system_account = $identity.IsSystem
              } | ConvertTo-Json -Compress
            `;
            const facts = { runner: process.env.RUNNER_NAME, standard_user_required: standardUser, ...JSON.parse(execFileSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command', command], { encoding: 'utf8', maxBuffer: 65536 }).replace(/^\uFEFF/, '')) };
            fs.writeFileSync(path.join(evidence, 'host.json'), JSON.stringify(facts, null, 2) + '\n');
            console.log(JSON.stringify(facts));
            if (facts.product_type !== 1 || facts.build < 22000 || !facts.caption.includes('Windows 11') || facts.architecture !== 'X64') {
              throw Error('WINDOWS_11_CLIENT_REQUIRED: no tests were started');
            }
            if (standardUser && (facts.elevated !== false || facts.administrators_group_present !== false || facts.system_account !== false ||
                facts.user_interactive !== true || !Number.isInteger(facts.session_id) || facts.session_id <= 0)) {
              throw Error('STANDARD_USER_INTERACTIVE_SESSION_REQUIRED: application tests were not started');
            }
            core.exportVariable('TRELLIS_WIN11_DESKTOP', String(facts.user_interactive && facts.session_id > 0));
            if (standardUser && !/^[0-9]+-[0-9]+$/.test(suffix)) throw Error('SOURCE_PATH_INVALID');
            core.exportVariable('TRELLIS_WIN11_SOURCE', standardUser ? 'trellis-standard-' + suffix : '.');
      - name: Prepare or select current-standard-user Git only
        id: git_prepare
        if: "!cancelled() && inputs.windows11_standard_user && steps.host.outcome == 'success'"
        timeout-minutes: 10
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawn, execFile } = require('node:child_process');
            const { performance } = require('node:perf_hooks');
            const approved = context.payload.inputs?.windows11_prepare_git === 'true';
            const reportFile = path.join(process.env.TRELLIS_WIN11_EVIDENCE, 'git-preparation.json');
            const source = 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.4/Git-2.56.0.4-64-bit.exe';
            const report = { approved_installation: approved, application_tests: 0, source, asset_id: 677312539,
              stage: 'inspect', candidates: [], exit_code: null, timeout: false, restart_required: false };
            function save() { fs.writeFileSync(reportFile, JSON.stringify(report, null, 2) + '\n'); }
            const env = {};
            // Explicit allowlist: no GitHub authorization, runner credentials, proxy credentials,
            // model keys, NODE_OPTIONS, or inherited Git configuration enters the child/installer.
            for (const key of ['SystemRoot', 'WINDIR', 'TEMP', 'TMP', 'USERPROFILE', 'HOMEDRIVE', 'HOMEPATH',
              'LOCALAPPDATA', 'APPDATA', 'ProgramData', 'ProgramFiles', 'ProgramFiles(x86)', 'CommonProgramFiles',
              'CommonProgramFiles(x86)', 'PUBLIC', 'RUNNER_TRACKING_ID']) {
              if (process.env[key]) env[key] = process.env[key];
            }
            env.PATH = path.join(env.SystemRoot, 'System32') + ';' + env.SystemRoot;
            env.ComSpec = path.join(env.SystemRoot, 'System32', 'cmd.exe');
            Object.assign(env, { GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: 'NUL', GIT_TERMINAL_PROMPT: '0', GCM_INTERACTIVE: 'Never' });
            // All synchronous metadata/versions are isolated so even an inaccessible path
            // cannot block the action thread. Only the two current-user locations are read.
            async function prepare(config) {
              const fs = require('node:fs'), path = require('node:path').win32;
              const { execFileSync, spawn, execFile } = require('node:child_process');
              const { Readable, Transform } = require('node:stream');
              const { pipeline } = require('node:stream/promises');
              const state = { candidates: [], exit_code: null, timeout: false, restart_required: false };
              const fail = code => { const error = new Error(); error.code = code; throw error; };
              const code = error => /^[A-Z0-9_]{1,60}$/.test(error?.code ?? '') ? error.code : 'PREPARATION_FAILED';
              const send = (stage, extra = {}) => process.send({ stage, ...state, ...extra });
              const boot = path.parse(process.env.SystemRoot ?? '').root.toLowerCase();
              function inspect(file, kind, missing = false) {
                if (!path.isAbsolute(file) || path.parse(file).root.toLowerCase() !== boot || !/^[a-z]:\\$/.test(boot)) fail('NONLOCAL_PATH');
                const absolute = path.resolve(file), root = path.parse(absolute).root;
                let current = root, stat = fs.lstatSync(root);
                if (!stat.isDirectory() || stat.isSymbolicLink()) fail('REPARSE_PATH');
                const parts = absolute.slice(root.length).split(path.sep).filter(Boolean);
                for (let index = 0; index < parts.length; index++) {
                  current = path.join(current, parts[index]);
                  try { stat = fs.lstatSync(current); }
                  catch (error) { if (missing && error.code === 'ENOENT') return null; throw error; }
                  if (stat.isSymbolicLink()) fail('REPARSE_PATH');
                  if (index < parts.length - 1 && !stat.isDirectory()) fail('INVALID_PATH');
                }
                if (kind === 'directory' ? !stat.isDirectory() : !stat.isFile()) fail('INVALID_PATH');
                fs.accessSync(absolute, fs.constants.R_OK);
                return absolute;
              }
              function version(candidate, exact = false) {
                candidate.started = false; candidate.exit = null; candidate.timeout = false;
                // Read only the PE header, never a file digest. Accept AMD64 executables only.
                const descriptor = fs.openSync(candidate.file, 'r'), header = Buffer.alloc(64), coff = Buffer.alloc(6);
                try {
                  if (fs.readSync(descriptor, header, 0, 64, 0) !== 64 || header.toString('ascii', 0, 2) !== 'MZ') fail('GIT_FORMAT_INVALID');
                  const offset = header.readUInt32LE(60);
                  if (offset > 1048576 || fs.readSync(descriptor, coff, 0, 6, offset) !== 6 || coff.readUInt32LE(0) !== 0x4550 || coff.readUInt16LE(4) !== 0x8664) fail('GIT_AMD64_REQUIRED');
                } finally { fs.closeSync(descriptor); }
                try {
                  // execFileSync is bounded to three seconds, with no shell or inherited credentials.
                  const text = execFileSync(candidate.file, ['--version'], { cwd: process.env.TEMP, env: process.env,
                    windowsHide: true, timeout: 3000, maxBuffer: 256, stdio: ['ignore', 'pipe', 'ignore'] }).toString().trim();
                  candidate.started = true; candidate.exit = 0;
                  const match = text.match(/^git version ([0-9]+\.[0-9]+\.[0-9]+\.windows\.[0-9]+)$/);
                  if (!match) fail('GIT_VERSION_INVALID');
                  const [major, minor] = match[1].split('.').map(Number);
                  if (!(major > 2 || major === 2 && minor >= 18) || exact && match[1] !== '2.56.0.windows.4') fail('GIT_VERSION_UNSUPPORTED');
                  candidate.version = match[1];
                } catch (error) {
                  if (error.pid) candidate.started = true;
                  if (Number.isInteger(error.status)) candidate.exit = error.status;
                  candidate.timeout = error.code === 'ETIMEDOUT';
                  candidate.error = code(error); throw error;
                }
              }
              const publicCandidates = () => state.candidates.map(({ file, directory, ...value }) => value);
              try {
                send('inspect');
                const profile = inspect(process.env.USERPROFILE ?? '', 'directory');
                const local = inspect(process.env.LOCALAPPDATA ?? '', 'directory');
                const relative = path.relative(profile, local);
                if (!relative || relative.startsWith('..') || path.isAbsolute(relative)) fail('CURRENT_USER_LOCALAPPDATA_REQUIRED');
                const roots = [path.join(local, 'Programs', 'Git'), path.join(local, 'Programs', 'Trellis-Toolchain', 'Git')];
                for (const [index, directory] of roots.entries()) {
                  const candidate = { category: index ? 'current_user_toolchain' : 'current_user_git', accessible: false,
                    started: false, exit: null, timeout: false, version: null, error: null, directory };
                  state.candidates.push(candidate);
                  if (!inspect(directory, 'directory', true)) { candidate.error = 'ABSENT'; continue; }
                  const file = inspect(path.join(directory, 'cmd', 'git.exe'), 'file', true);
                  if (!file) {
                    if (fs.readdirSync(directory).length) fail('NONEMPTY_GIT_TARGET_CONFLICT');
                    candidate.error = 'EMPTY'; continue;
                  }
                  candidate.accessible = true; candidate.file = file;
                }
                send('versions', { candidates: publicCandidates() });
                for (const candidate of state.candidates) if (candidate.accessible) version(candidate);
                let selected = state.candidates.find(candidate => candidate.version);
                if (selected) {
                  send('ready', { candidates: publicCandidates(), result: 'reused', version: selected.version, selected_directory: path.dirname(selected.file) });
                } else if (!config.approved) {
                  send('ready', { candidates: publicCandidates(), result: 'not_selected' });
                } else {
                  const target = roots[1];
                  // Recheck before installation; never replace unknown or nonempty contents.
                  if (inspect(target, 'directory', true) && fs.readdirSync(target).length) fail('NONEMPTY_GIT_TARGET_CONFLICT');
                  const temp = inspect(config.temp, 'directory');
                  if (!/^[0-9]+-[0-9]+$/.test(config.suffix)) fail('WORK_PATH_INVALID');
                  const work = path.join(temp, 'trellis-git-' + config.suffix);
                  if (inspect(work, 'directory', true)) fail('WORK_ALREADY_EXISTS');
                  fs.mkdirSync(work);
                  const installer = path.join(work, 'Git-2.56.0.4-64-bit.exe');
                  send('download', { candidates: publicCandidates() });
                  const response = await fetch(config.source, { headers: { 'User-Agent': 'Trellis-Windows11-Git-preparation', Accept: 'application/octet-stream' }, credentials: 'omit', signal: AbortSignal.timeout(180000) });
                  if (!response.ok) fail('DOWNLOAD_HTTP_' + response.status);
                  if (!['github.com', 'release-assets.githubusercontent.com'].includes(new URL(response.url).hostname)) fail('DOWNLOAD_SOURCE_INVALID');
                  const expected = 66850032;
                  if (response.headers.has('content-length') && Number(response.headers.get('content-length')) !== expected) fail('INSTALLER_SIZE_INVALID');
                  let size = 0;
                  const limit = new Transform({ transform(chunk, encoding, callback) { size += chunk.length; callback(size > expected ? Object.assign(new Error(), { code: 'INSTALLER_SIZE_INVALID' }) : null, chunk); } });
                  await pipeline(Readable.fromWeb(response.body), limit, fs.createWriteStream(installer, { flags: 'wx' }));
                  if (size !== expected) fail('INSTALLER_SIZE_INVALID');
                  const descriptor = fs.openSync(installer, 'r'), magic = Buffer.alloc(2);
                  try { if (fs.readSync(descriptor, magic, 0, 2, 0) !== 2 || magic.toString('ascii') !== 'MZ') fail('INSTALLER_FORMAT_INVALID'); }
                  finally { fs.closeSync(descriptor); }
                  if (inspect(target, 'directory', true) && fs.readdirSync(target).length) fail('NONEMPTY_GIT_TARGET_CONFLICT');
                  fs.mkdirSync(target, { recursive: true });
                  inspect(target, 'directory');
                  send('install', { candidates: publicCandidates() });
                  const args = ['/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/DIR=' + target,
                    '/o:PathOption=BashOnly', '/COMPONENTS=', '/NOICONS', '/LOG=' + path.join(work, 'installer-raw.log')];
                  state.exit_code = await new Promise((resolve, reject) => {
                    const child = spawn(installer, args, { cwd: work, env: process.env, windowsHide: true, stdio: 'ignore' });
                    let timer, timedOut = false;
                    child.once('error', error => { clearTimeout(timer); reject(error); });
                    child.once('exit', value => { clearTimeout(timer); if (!timedOut) resolve(value); });
