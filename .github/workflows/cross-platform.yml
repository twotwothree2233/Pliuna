          TRELLIS_WINDOWS11_ACL_PERFORMANCE: '1'
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec vitest run --config vitest.windows11-acl-performance.config.ts
      - name: Diagnose isolated Windows 11 file startup
        env:
          TRELLIS_WINDOWS11_STARTUP_PROBE: '1'
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && (inputs.windows11_startup_probe_only || inputs.windows11_process_package_only) && steps.build.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec vitest run --config vitest.windows11-probe.config.ts
      - name: Portable tests (Node ABI)
        id: portable
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm test:portable
      - name: Windows 11 core process lifecycle (Node ABI)
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec vitest run --config vitest.process.config.ts tests/unit/platform-process-tree.test.ts tests/unit/monty-lifecycle.test.ts
      - name: Filesystem behavior (synthetic integrity, Node ABI)
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && !inputs.windows11_process_package_only && steps.build.outcome == 'success' && steps.portable.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec vitest run --config vitest.files.config.ts
      - name: Process trees and lifecycle (synthetic integrity, Node ABI)
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success' && steps.portable.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec vitest run --config vitest.process.config.ts
      - name: Production payload and desktop platform checks
        id: packaging_checks
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success' && steps.portable.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm test:packaging
      - name: Probe installed Node bindings
        id: node_native
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/check-native.mjs
      - name: Probe installed Electron bindings and Job Object
        id: electron_native
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.node_native.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm verify:native:electron
      - name: Verify integrated native ACL safety (Electron)
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.electron_native.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node -e "require('node:child_process').execFileSync(require('electron'), ['scripts/verify-windows-acl.mjs'], {env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit',windowsHide:true})"
      - name: Process control with Electron runtime
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.electron_native.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/check-electron-process.mjs
      - name: Require an interactive desktop for GUI acceptance
        id: desktop
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.electron_native.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: |
          if not "%TRELLIS_WIN11_DESKTOP%"=="true" (
            echo INTERACTIVE_DESKTOP_REQUIRED: GUI acceptance remains unverified
            exit /b 1
          )
      - name: Windows 11 desktop startup and restart
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.desktop.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test platform-smoke.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/source-desktop"
      - name: Build local directory package
        id: directory_package
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.build.outcome == 'success' && steps.electron_native.outcome == 'success' && steps.packaging_checks.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/package-desktop.mjs --output "%TRELLIS_DESKTOP_OUTPUT%" --format dir
      - name: Probe packaged native modules, process trees and offline PDF
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.directory_package.outcome == 'success')"
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: node scripts/check-desktop-runtime.mjs "%TRELLIS_DESKTOP_OUTPUT%"
      - name: Windows 11 packaged desktop startup and restart
        if: "!inputs.windows11_checkout_probe_only && (!inputs.windows11_standard_user || steps.standard_tools.outcome == 'success') && (!cancelled() && !inputs.windows11_startup_probe_only && steps.directory_package.outcome == 'success' && steps.desktop.outcome == 'success')"
        env:
          TRELLIS_PACKAGED_OUTPUT: ${{ env.TRELLIS_DESKTOP_OUTPUT }}
        working-directory: ${{ env.TRELLIS_WIN11_SOURCE }}
        run: pnpm exec playwright test platform-smoke.spec.ts --output "%TRELLIS_WIN11_EVIDENCE%/packaged-desktop"
      - name: Keep the checkout diagnostic stage
        if: "always() && inputs.windows11_checkout_probe_only && steps.host.outcome == 'success'"
        uses: actions/github-script@v7
        env:
          CHECKOUT_OUTCOME: ${{ steps.source_checkout.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const file = path.join(process.env.TRELLIS_WIN11_EVIDENCE, 'checkout-preparation.json');
            const report = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : { stage: 'precheck_unavailable', candidates: [] };
            const outcomes = new Set(['success', 'failure', 'cancelled', 'skipped']);
            report.checkout = outcomes.has(process.env.CHECKOUT_OUTCOME) ? process.env.CHECKOUT_OUTCOME : 'unknown';
            report.application_tests = 0;
            if (report.checkout !== 'success' && report.stage === 'source_ready') report.stage = 'checkout_' + report.checkout;
            fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify({ stage: report.stage, checkout: report.checkout, application_tests: 0 }));
      - name: Keep Windows 11 environment and desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trellis-win11-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
